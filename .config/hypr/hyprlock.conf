# =============================================================================
# HYPRLOCK CONFIGURATION (KAPTIVACE STYLE)
# =============================================================================

# 1. ФОН (Размытый скриншот экрана)
background {
    monitor =
    path = screenshot               # Размывает текущее изображение экрана
    # path = ~/Pictures/wallpapers/your_wallpaper.png # Либо путь к обоям

    blur_passes = 3                 # Включаем блюр (качество размытия)
    blur_size = 6                   # Радиус блюра
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# 2. ДАТА (Сверху, мелкий шрифт)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(143, 161, 129, 0.7)
    font_size = 18
    font_family = JetBrains Mono

    position = 0, 160
    halign = center
    valign = center
}

# 3. КРУПНЫЕ ЧАСЫ (По центру над аватаркой)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(143, 161, 129, 1.0)
    font_size = 80
    font_family = JetBrains Mono Bold

    position = 0, 80
    halign = center
    valign = center
}

# 5. ПОЛЕ ВВОДА ПАРОЛЯ (Внизу)
input-field {
    monitor =
    size = 220, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(143, 161, 129, 0.5)     # Тонкая рамка в тон часам
    inner_color = rgba(30, 32, 36, 0.5)        # Полупрозрачный темный фон
    font_color = rgb(143, 161, 129)            # Точки при вводе
    fade_on_empty = false
    
    placeholder_text = <span foreground="##8fa181">Input Password...</span>
    hide_input = false
    rounding = 20                                # Плавное овальное закругление

    check_color = rgba(215, 153, 33, 0.8)
    fail_color = rgba(204, 36, 29, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -110
    halign = center
    valign = center
}

