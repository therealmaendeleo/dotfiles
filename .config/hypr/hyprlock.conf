# =============================================================================
# HYPRLOCK CONFIGURATION (KAPTIVACE STYLE - GREEN & WHITE EDITION)
# =============================================================================

# 1. ФОН (Текущие обои с легким блюром и затемнением)
background {
    monitor =
    path = ~/.config/hypr/current_wallpaper.jpg

    blur_passes = 2               # Легкий блюр (2 прохода), чтобы обои не отвлекали от интерфейса
    blur_size = 4                 # Радиус размытия
    brightness = 0.45             # Затемнение обоев
    contrast = 0.95
    vibrancy = 0.2
}

# 2. ДАТА (Сверху, чистый белый цвет для отличной читаемости)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(245, 245, 245, 0.9)  # Белый с легкой полупрозрачностью
    font_size = 18
    font_family = JetBrains Mono

    position = 0, 160
    halign = center
    valign = center
}

# 3. КРУПНЫЕ ЧАСЫ (По центру — чистый белый)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(245, 245, 245, 0.98)
    font_size = 80
    font_family = JetBrains Mono Bold

    position = 0, 80
    halign = center
    valign = center
}

# 4. ИНДИКАТОР РАСКЛАДКИ КЛАВИАТУРЫ (Фирменный зеленый акцент)
label {
    monitor =
    text = $LAYOUT
    color = rgba(167, 214, 149, 0.9)   # Травянисто-зеленый оттенок
    font_size = 14
    font_family = JetBrains Mono Medium

    position = 0, 10
    halign = center
    valign = center
}

# 5. ПОЛЕ ВВОДА ПАРОЛЯ (Внизу, с зеленой рамкой)
input-field {
    monitor =
    size = 240, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    # Зеленая полупрозрачная обводка
    outer_color = rgba(135, 192, 137, 0.6)      
    inner_color = rgba(30, 35, 30, 0.65)        # Глубокий темно-зеленовато-серый фон
    font_color = rgb(167, 214, 149)             # Цвет вводимых точек
    fade_on_empty = false
    
    # Чистый текст подсказки
    placeholder_text = Locked • Enter Password
    
    hide_input = false
    rounding = 20

    check_color = rgba(215, 153, 33, 0.8)
    fail_color = rgba(204, 36, 29, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -110
    halign = center
    valign = center
}
