# Размытие фона под Waybar
layerrule = blur match:namespace:waybar

# Формат: monitor = ИМЯ, РАЗРЕШЕНИЕ, ПОЗИЦИЯ, МАСШТАБ
monitor = , preferred, auto, 1.33

xwayland {
    force_zero_scaling = true
}

general {
    gaps_in = 2
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(719672ff) rgba(799dcbff) 45deg
    col.inactive_border = rgba(4e4e4eff)
    layout = dwindle
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = false
#         size = 6
#         passes = 1
    }

    shadow {
	enabled = false
# 	range = 12
# 	render_power = 3
#	color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
#     bezier = myCurve, 0.27, 0.5, 0.29, 1.0
    animation = windows, 1, 3, default, popin 90%
    animation = windowsOut, 1, 2, default, popin 90%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 2, default, slide
}

