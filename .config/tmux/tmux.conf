# --- common settings ---
set -g mouse on
set -g history-limit 10000
set -g renumber-windows on
set -g pane-border-lines simple

# --- colors (named colors follow the terminal palette) ---
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",alacritty:RGB"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=green"

# --- keybindings ---
set -g prefix C-b
set -g prefix2 C-a
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind | split-window -h
bind - split-window -v
bind Enter copy-mode

# --- indexes ---
set -g base-index 1
set -g pane-base-index 1

# --- copy mode ---
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- minimal status bar (no plugins) ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=default"

set -g status-left "#[fg=green,bold]#{s|/home/maendeleo|~|:pane_current_path}"
set -g status-left-length 45
set -g status-right "#[fg=blue]%d.%m #[fg=green]%H:%M"
set -g status-right-length 24

set -g status-justify left
set -g window-status-style "fg=default,bg=default"
set -g window-status-format " #I:#W "
set -g window-status-current-style "fg=black,bg=green,bold"
set -g window-status-current-format "#[fg=black,bg=green,bold] #I:#W "
set -g window-status-last-style "fg=green,bg=default"
set -g window-status-activity-style "fg=yellow,bg=default"
set -g window-status-bell-style "fg=red,bg=default"
set -g window-status-separator ""

set -g display-time 1500
set -g message-style "fg=black,bg=green"
set -g mode-style "fg=black,bg=green"
